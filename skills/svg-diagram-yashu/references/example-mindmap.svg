<svg viewBox="0 0 720 540" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>内容选题方法思维导图（优化版）</title>
  <desc>以"内容选题方法"为中心，左右各 3 条主分支（热点追踪/用户调研/竞品分析、数据复盘/垂直深耕/热点跨界），每个主分支带 2 个子节点。主分支垂直间距 200px，每个主分支的子节点上下分布且与其他主分支保持 120px 间距，避免挤压。中心节点加阴影 + 渐变强化层级。配色将原本的两个绿色调整为"蓝绿"+"青绿"以区分。</desc>

  <defs>
    <filter id="centerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="centerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F3F3C"/>
      <stop offset="100%" stop-color="#262624"/>
    </linearGradient>
  </defs>

  <!-- ============ 连线层 ============ -->
  <!-- 中心 → 主分支（粗线 + 平滑弧） -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M295,270 C275,270 235,70 260,70"  stroke="#534AB7"/>
    <path d="M295,270 L260,270"                stroke="#0F6E56"/>
    <path d="M295,270 C275,270 235,470 260,470" stroke="#BA7517"/>
    <path d="M425,270 C445,270 485,70 460,70"  stroke="#185FA5"/>
    <path d="M425,270 L460,270"                stroke="#993C1D"/>
    <path d="M425,270 C445,270 485,470 460,470" stroke="#0E7C7A"/>
  </g>

  <!-- 主分支 → 子节点（细弧，控制点与起点/终点同向，避免反折） -->
  <g fill="none" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
    <!-- 左 1：热点追踪 -->
    <path d="M145,70 C125,70 120,30 105,30"   stroke="#534AB7"/>
    <path d="M145,70 C125,70 120,110 105,110" stroke="#534AB7"/>
    <!-- 左 2：用户调研 -->
    <path d="M145,270 C125,270 120,230 105,230" stroke="#0F6E56"/>
    <path d="M145,270 C125,270 120,310 105,310" stroke="#0F6E56"/>
    <!-- 左 3：竞品分析 -->
    <path d="M145,470 C125,470 120,430 105,430" stroke="#BA7517"/>
    <path d="M145,470 C125,470 120,510 105,510" stroke="#BA7517"/>
    <!-- 右 1：数据复盘 -->
    <path d="M575,70 C595,70 600,30 615,30"   stroke="#185FA5"/>
    <path d="M575,70 C595,70 600,110 615,110" stroke="#185FA5"/>
    <!-- 右 2：垂直深耕 -->
    <path d="M575,270 C595,270 600,230 615,230" stroke="#993C1D"/>
    <path d="M575,270 C595,270 600,310 615,310" stroke="#993C1D"/>
    <!-- 右 3：热点跨界（原绿色调整为青绿） -->
    <path d="M575,470 C595,470 600,430 615,430" stroke="#0E7C7A"/>
    <path d="M575,470 C595,470 600,510 615,510" stroke="#0E7C7A"/>
  </g>

  <!-- ============ 中心节点（强化层级） ============ -->
  <g filter="url(#centerShadow)">
    <rect x="295" y="242" width="130" height="56" rx="14" fill="url(#centerGrad)" stroke="#161614" stroke-width="0.6"/>
    <text x="360" y="270" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="17" font-weight="700" fill="#F6F6F3">内容选题方法</text>
  </g>

  <!-- ============ 6 个主分支节点（带编号） ============ -->
  <!-- 左 1：热点追踪 -->
  <g>
    <rect x="145" y="48" width="115" height="44" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.7"/>
    <text x="160" y="70" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="13" font-weight="600" fill="#534AB7">①</text>
    <text x="213" y="70" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="600" fill="#2A2570">热点追踪</text>
  </g>
  <!-- 左 2：用户调研 -->
  <g>
    <rect x="145" y="248" width="115" height="44" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.7"/>
    <text x="160" y="270" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="13" font-weight="600" fill="#0F6E56">②</text>
    <text x="213" y="270" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="600" fill="#0B4A3A">用户调研</text>
  </g>
  <!-- 左 3：竞品分析 -->
  <g>
    <rect x="145" y="448" width="115" height="44" rx="10" fill="#FAC775" stroke="#BA7517" stroke-width="0.7"/>
    <text x="160" y="470" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="13" font-weight="600" fill="#BA7517">③</text>
    <text x="213" y="470" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="600" fill="#7A4D10">竞品分析</text>
  </g>
  <!-- 右 1：数据复盘 -->
  <g>
    <rect x="460" y="48" width="115" height="44" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.7"/>
    <text x="475" y="70" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="13" font-weight="600" fill="#185FA5">①</text>
    <text x="528" y="70" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="600" fill="#103E6C">数据复盘</text>
  </g>
  <!-- 右 2：垂直深耕 -->
  <g>
    <rect x="460" y="248" width="115" height="44" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.7"/>
    <text x="475" y="270" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="13" font-weight="600" fill="#993C1D">②</text>
    <text x="528" y="270" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="600" fill="#6B2814">垂直深耕</text>
  </g>
  <!-- 右 3：热点跨界（青绿） -->
  <g>
    <rect x="460" y="448" width="115" height="44" rx="10" fill="#B0D9DC" stroke="#0E7C7A" stroke-width="0.7"/>
    <text x="475" y="470" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="13" font-weight="600" fill="#0E7C7A">③</text>
    <text x="528" y="470" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="14" font-weight="600" fill="#0A4F4E">热点跨界</text>
  </g>

  <!-- ============ 12 个子节点 ============ -->
  <!-- 左 1：热点追踪 的两个子 -->
  <g>
    <rect x="20" y="14" width="85" height="32" rx="6" fill="#EEEDFE" stroke="#CECBF6" stroke-width="0.6"/>
    <text x="62.5" y="30" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">微博热搜</text>
  </g>
  <g>
    <rect x="20" y="94" width="85" height="32" rx="6" fill="#EEEDFE" stroke="#CECBF6" stroke-width="0.6"/>
    <text x="62.5" y="110" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">抖音热榜</text>
  </g>
  <!-- 左 2：用户调研 的两个子 -->
  <g>
    <rect x="20" y="214" width="85" height="32" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.6"/>
    <text x="62.5" y="230" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">评论区挖掘</text>
  </g>
  <g>
    <rect x="20" y="294" width="85" height="32" rx="6" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.6"/>
    <text x="62.5" y="310" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">问卷访谈</text>
  </g>
  <!-- 左 3：竞品分析 的两个子 -->
  <g>
    <rect x="20" y="414" width="85" height="32" rx="6" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.6"/>
    <text x="62.5" y="430" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">同行爆款</text>
  </g>
  <g>
    <rect x="20" y="494" width="85" height="32" rx="6" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.6"/>
    <text x="62.5" y="510" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">跨平台借鉴</text>
  </g>

  <!-- 右 1：数据复盘 的两个子 -->
  <g>
    <rect x="615" y="14" width="85" height="32" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.6"/>
    <text x="657.5" y="30" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">高赞内容</text>
  </g>
  <g>
    <rect x="615" y="94" width="85" height="32" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.6"/>
    <text x="657.5" y="110" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">爆款拆解</text>
  </g>
  <!-- 右 2：垂直深耕 的两个子 -->
  <g>
    <rect x="615" y="214" width="85" height="32" rx="6" fill="#FAECE7" stroke="#F5C4B3" stroke-width="0.6"/>
    <text x="657.5" y="230" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">行业深度</text>
  </g>
  <g>
    <rect x="615" y="294" width="85" height="32" rx="6" fill="#FAECE7" stroke="#F5C4B3" stroke-width="0.6"/>
    <text x="657.5" y="310" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">系列连载</text>
  </g>
  <!-- 右 3：热点跨界 的两个子 -->
  <g>
    <rect x="615" y="414" width="85" height="32" rx="6" fill="#E5F2F2" stroke="#B0D9DC" stroke-width="0.6"/>
    <text x="657.5" y="430" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">节日节点</text>
  </g>
  <g>
    <rect x="615" y="494" width="85" height="32" rx="6" fill="#E5F2F2" stroke="#B0D9DC" stroke-width="0.6"/>
    <text x="657.5" y="510" text-anchor="middle" dominant-baseline="central"
          font-family="sans-serif" font-size="12" font-weight="500" fill="#1F2937">跨界联动</text>
  </g>
</svg>