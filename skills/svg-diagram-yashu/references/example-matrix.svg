<svg viewBox="0 0 680 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>选题优先级四象限矩阵</title>
  <desc>艾森豪威尔矩阵：横轴紧急程度（左不紧急→右紧急），纵轴重要程度（下不重要→上重要）。四个象限为立即做、计划做、委托、删除。8 个选题以圆点分布，突发热点为强调项。</desc>

  <!-- 标题 + 副标题（层级强化） -->
  <text x="340" y="25" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="17" font-weight="600" fill="#1f2937">选题优先级 · 四象限矩阵</text>
  <text x="340" y="45" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#888780">艾森豪威尔矩阵 · 8 个候选选题分布</text>

  <!-- 四象限背景（饱和度从 ~10% 提到 ~22%） -->
  <rect x="80" y="80" width="260" height="220" fill="#F5E0BC" stroke="none"/>
  <rect x="340" y="80" width="260" height="220" fill="#C9E3A8" stroke="none"/>
  <rect x="80" y="300" width="260" height="220" fill="#E8E4D9" stroke="none"/>
  <rect x="340" y="300" width="260" height="220" fill="#D4E8F8" stroke="none"/>

  <!-- 坐标轴（1.5px→1px，深灰→浅灰，让位于内容） -->
  <g stroke="#B8B6B0" stroke-width="1" fill="none">
    <line x1="70" y1="300" x2="610" y2="300"/>
    <line x1="340" y1="70" x2="340" y2="530"/>
  </g>

  <!-- 象限标签（13px→15px，weight 500→600） -->
  <g font-family="sans-serif" font-size="15" font-weight="600">
    <text x="95" y="100" text-anchor="start" dominant-baseline="central" fill="#633806">计划做</text>
    <text x="585" y="100" text-anchor="end" dominant-baseline="central" fill="#27500A">立即做</text>
    <text x="95" y="505" text-anchor="start" dominant-baseline="central" fill="#444441">删除</text>
    <text x="585" y="505" text-anchor="end" dominant-baseline="central" fill="#0C447C">委托</text>
  </g>

  <!-- 空象限说明（避免"漏点"误读） -->
  <text x="210" y="410" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#9C9A92" font-style="italic">暂无可删除项</text>

  <!-- 坐标轴标签（"不重要"从底部中心挪到左下，对齐"不紧急"） -->
  <g font-family="sans-serif" font-size="12" fill="#5F5E5A">
    <text x="75" y="300" text-anchor="end" dominant-baseline="central">不紧急</text>
    <text x="605" y="300" text-anchor="start" dominant-baseline="central">紧急</text>
    <text x="340" y="65" text-anchor="middle" dominant-baseline="central">↑ 重要程度</text>
    <text x="340" y="548" text-anchor="middle" dominant-baseline="central">紧急程度 →</text>
    <text x="75" y="540" text-anchor="end" dominant-baseline="central" fill="#888780">不重要</text>
  </g>

  <!-- 普通数据点（按象限加对应色描边，建立视觉呼应） -->
  <!-- 计划做：棕色描边，纵向分散避免上扎堆 -->
  <g fill="#444441" stroke="#633806" stroke-width="1.2">
    <circle cx="180" cy="135" r="6"/>
    <circle cx="155" cy="200" r="6"/>
    <circle cx="240" cy="260" r="6"/>
  </g>
  <!-- 立即做：绿色描边 -->
  <g fill="#444441" stroke="#27500A" stroke-width="1.2">
    <circle cx="445" cy="200" r="6"/>
  </g>
  <!-- 委托：蓝色描边，数据周报从十字线附近推到象限深处 -->
  <g fill="#444441" stroke="#0C447C" stroke-width="1.2">
    <circle cx="485" cy="395" r="6"/>
    <circle cx="410" cy="455" r="6"/>
    <circle cx="505" cy="485" r="6"/>
  </g>

  <!-- 突发热点（强调点） -->
  <g>
    <circle cx="540" cy="160" r="11" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
    <circle cx="540" cy="160" r="5" fill="#A32D2D"/>
  </g>

  <!-- 突发热点注释引线（解释"为什么强调"） -->
  <g stroke="#A32D2D" stroke-width="0.8" fill="none">
    <path d="M540 172 L575 195 L605 195"/>
  </g>
  <text x="608" y="195" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#A32D2D" font-weight="500">优先处理</text>

  <!-- 数据点标签 -->
  <g font-family="sans-serif" font-size="11" fill="#3F3F3D">
    <text x="190" y="135" text-anchor="start" dominant-baseline="central">行业长文</text>
    <text x="165" y="200" text-anchor="start" dominant-baseline="central">系列连载</text>
    <text x="250" y="260" text-anchor="start" dominant-baseline="central">跨界合作</text>
    <text x="455" y="200" text-anchor="start" dominant-baseline="central">节日节点</text>
    <text x="495" y="395" text-anchor="start" dominant-baseline="central">数据周报</text>
    <text x="420" y="455" text-anchor="start" dominant-baseline="central">评论互动</text>
    <text x="515" y="485" text-anchor="start" dominant-baseline="central">日常签到</text>
  </g>
  <!-- 突发热点标签（红色强调） -->
  <text x="552" y="160" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#A32D2D" font-weight="600">突发热点</text>
</svg>
