<svg viewBox="0 0 680 450" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Order Processing State Machine</title>
  <desc>A state machine diagram showing the lifecycle of an order through Pending, Processing, Shipped, Delivered, and Cancelled states.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="340" y1="94" x2="340" y2="145" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <polyline points="340,194 340,230 185,230 185,265" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <polyline points="340,194 340,230 495,230 495,265" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <polyline points="185,314 185,345 290,345 290,375" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <g>
    <rect x="295" y="50" width="90" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Pending</text>
  </g>

  <g>
    <rect x="280" y="150" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Processing</text>
  </g>

  <g>
    <rect x="140" y="270" width="90" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="185" y="292" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Shipped</text>
  </g>

  <g>
    <rect x="440" y="270" width="110" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="495" y="292" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">Cancelled</text>
  </g>

  <g>
    <rect x="290" y="380" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="402" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Delivered</text>
  </g>
</svg>
