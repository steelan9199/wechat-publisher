<svg viewBox="0 0 680 480" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>阅读量下降原因 6M 鱼骨图</title>
  <desc>因果分析鱼骨图：中央水平主干指向右侧鱼头（阅读量下降），6 条斜肋从主干上下交替分叉，分别代表 6M 类别（人/法/环/机/料/测），每条肋上挂 2 条虚线子原因。全图统一中性灰。</desc>

  <text x="340" y="34" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#1f2937">阅读量下降 · 6M 因果分析</text>

  <line x1="80" y1="250" x2="560" y2="250" stroke="#5F5E5A" stroke-width="2"/>

  <g>
    <rect x="560" y="220" width="100" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="610" y="244" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#791F1F">阅读量</text>
    <text x="610" y="262" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#791F1F">下降</text>
  </g>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <line x1="180" y1="250" x2="120" y2="146"/>
    <line x1="300" y1="250" x2="240" y2="146"/>
    <line x1="420" y1="250" x2="360" y2="146"/>
    <line x1="180" y1="250" x2="120" y2="354"/>
    <line x1="300" y1="250" x2="240" y2="354"/>
    <line x1="420" y1="250" x2="360" y2="354"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#444441">
    <text x="110" y="140" text-anchor="end" dominant-baseline="central">人</text>
    <text x="230" y="140" text-anchor="end" dominant-baseline="central">法</text>
    <text x="350" y="140" text-anchor="end" dominant-baseline="central">环</text>
    <text x="110" y="366" text-anchor="end" dominant-baseline="central">机</text>
    <text x="230" y="366" text-anchor="end" dominant-baseline="central">料</text>
    <text x="350" y="366" text-anchor="end" dominant-baseline="central">测</text>
  </g>

  <g stroke="#888780" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <line x1="160" y1="215" x2="200" y2="215"/>
    <line x1="140" y1="181" x2="180" y2="181"/>
    <line x1="280" y1="215" x2="320" y2="215"/>
    <line x1="260" y1="181" x2="300" y2="181"/>
    <line x1="400" y1="215" x2="440" y2="215"/>
    <line x1="380" y1="181" x2="420" y2="181"/>
    <line x1="160" y1="285" x2="200" y2="285"/>
    <line x1="140" y1="319" x2="180" y2="319"/>
    <line x1="280" y1="285" x2="320" y2="285"/>
    <line x1="260" y1="319" x2="300" y2="319"/>
    <line x1="400" y1="285" x2="440" y2="285"/>
    <line x1="380" y1="319" x2="420" y2="319"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">
    <text x="205" y="215" text-anchor="start" dominant-baseline="central">更新频率低</text>
    <text x="185" y="181" text-anchor="start" dominant-baseline="central">选题陈旧</text>
    <text x="325" y="215" text-anchor="start" dominant-baseline="central">发布时段差</text>
    <text x="305" y="181" text-anchor="start" dominant-baseline="central">排版不规范</text>
    <text x="445" y="215" text-anchor="start" dominant-baseline="central">算法调整</text>
    <text x="425" y="181" text-anchor="start" dominant-baseline="central">平台限流</text>
    <text x="205" y="285" text-anchor="start" dominant-baseline="central">设备性能差</text>
    <text x="185" y="319" text-anchor="start" dominant-baseline="central">剪辑工具弱</text>
    <text x="325" y="285" text-anchor="start" dominant-baseline="central">素材同质化</text>
    <text x="305" y="319" text-anchor="start" dominant-baseline="central">标题不吸引</text>
    <text x="445" y="285" text-anchor="start" dominant-baseline="central">数据未复盘</text>
    <text x="425" y="319" text-anchor="start" dominant-baseline="central">指标看不清</text>
  </g>
</svg>
