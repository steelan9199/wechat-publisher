<svg viewBox="0 0 680 300" width="100%" role="img">
  <title>手机截图回传 · 架构图</title>
  <desc>AI 客户端通过 HTTP 调用本地中继服务器，服务器经 WebSocket 让手机 autojs 截屏并回传 base64，最终由 AI 用 image-pixel-viewer 打开。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1f2937">手机截图回传 · 架构图</text>

  <g>
    <rect x="30" y="118" width="170" height="84" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="115" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1f2937">AI 客户端</text>
    <text x="115" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">说"手机截图" + 打开图</text>
  </g>

  <g>
    <rect x="255" y="118" width="170" height="84" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1f2937">中继服务器</text>
    <text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">aiohttp · PC 本地</text>
  </g>

  <g>
    <rect x="480" y="118" width="170" height="84" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="565" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1f2937">手机 autojs</text>
    <text x="565" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">小米 11 PRO</text>
  </g>

  <line x1="200" y1="145" x2="250" y2="145" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="145" x2="475" y2="145" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="177" x2="425" y2="177" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="177" x2="200" y2="177" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="225" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">① HTTP GET /screenshot</text>
  <text x="450" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">② WS {action:capture}</text>
  <text x="450" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">③ WS 回传 base64 截图</text>
  <text x="225" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">④ 返回 PNG 路径</text>
</svg>
