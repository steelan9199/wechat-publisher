<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>内容团队组织架构图</title>
  <desc>三层组织架构：内容总负责人（根）下分内容创作部、用户增长部两个一级部门；内容创作部下有选题组、剪辑组，用户增长部下有投放组、数据组。同部门从根到叶用同一色系，直角折线连接无箭头。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="34" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#1f2937">内容团队 · 组织架构</text>

  <g stroke="#5F5E5A" stroke-width="1" fill="none">
    <path d="M340,114 V152 H220 V190 M220,152 H460 V190"/>
    <path d="M220,234 V272 H160 V310 M160,272 H280 V310"/>
    <path d="M460,234 V272 H400 V310 M400,272 H520 V310"/>
  </g>

  <g>
    <rect x="280" y="70" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="92" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#1f2937">内容总负责人</text>
  </g>

  <g>
    <rect x="160" y="190" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="220" y="212" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#1f2937">内容创作部</text>
  </g>
  <g>
    <rect x="400" y="190" width="120" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="460" y="212" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#1f2937">用户增长部</text>
  </g>

  <g>
    <rect x="110" y="310" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="160" y="332" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#1f2937">选题组</text>
  </g>
  <g>
    <rect x="230" y="310" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="280" y="332" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#1f2937">剪辑组</text>
  </g>
  <g>
    <rect x="350" y="310" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="400" y="332" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#1f2937">投放组</text>
  </g>
  <g>
    <rect x="470" y="310" width="100" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="520" y="332" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#1f2937">数据组</text>
  </g>
</svg>
