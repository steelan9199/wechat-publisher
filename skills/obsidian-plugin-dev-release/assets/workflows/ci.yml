name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Confirm build output is not committed
        run: |
          if git ls-files --error-unmatch main.js >/dev/null 2>&1; then
            echo "::error::main.js is tracked by git. It is a build artifact and must stay gitignored."
            exit 1
          fi
          echo "main.js is correctly untracked."
